name: apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: build
        working-directory: zanocuj-kompas
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create apk-${{ github.run_number }}
             zanocuj-kompas/app/build/outputs/apk/debug/app-debug.apk
             --title "APK ${{ github.run_number }}" --notes debug
